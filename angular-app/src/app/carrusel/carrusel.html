<section id="seccion1" class="py-5 bg-light">
  <div class="container">
    <h2 class="text-center mb-4">
      <i class="fas fa-bullhorn text-primary"></i> Promociones de la Clínica
    </h2>
    <p class="text-center lead mb-4">Descubre nuestros servicios con precios especiales</p>

    <!-- Carrusel de Bootstrap -->
    <div id="carruselPromociones" class="carousel slide shadow rounded" data-bs-ride="carousel">
      
      <!-- Indicadores -->
      <div class="carousel-indicators">
        <button 
          *ngFor="let promo of promociones; let i = index"
          type="button" 
          data-bs-target="#carruselPromociones" 
          [attr.data-bs-slide-to]="i"
          [class.active]="i === 0"
          [attr.aria-current]="i === 0 ? 'true' : null"
          [attr.aria-label]="'Promoción ' + (i + 1)">
        </button>
      </div>

      <!-- Slides -->
      <div class="carousel-inner rounded">
        <div 
          *ngFor="let promo of promociones; let i = index"
          class="carousel-item"
          [class.active]="i === 0">
          
          <img 
            [src]="promo.imagen" 
            class="d-block w-100" 
            [alt]="promo.titulo">
          
          <div class="carousel-caption d-none d-md-block">
            <h3><i [class]="promo.icono"></i> {{ promo.titulo }}</h3>
            <p class="lead">{{ promo.descripcion }}</p>
            <a href="#seccion3" class="btn btn-lg" [class]="promo.botonClase">
              <i class="fas fa-calendar-check"></i> Agendar ahora
            </a>
          </div>
        </div>
      </div>

      <!-- Controles -->
      <button class="carousel-control-prev" type="button" 
              data-bs-target="#carruselPromociones" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" 
              data-bs-target="#carruselPromociones" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>

    </div>
  </div>
</section>
